<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Blackveil · Videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --ink:#eef2f6; --dim:#9aa2ab; --line:rgba(238,242,246,.14);
    --hot:#cfd6dd; --love:#ff4d6d; --card:#060607;
    --serif:"Bodoni Moda",Georgia,serif; --sans:"Manrope",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}

  /* ---------- top bar ---------- */
  .bar{position:fixed;left:0;right:0;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:calc(11px + env(safe-area-inset-top,0px)) 16px 11px;
    background:rgba(2,2,3,.92);border-bottom:1px solid var(--line)}
  .bar a{color:var(--ink);text-decoration:none;font-family:var(--serif);font-size:1rem}
  .bar .t{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}

  /* ---------- feed ---------- */
  .feed{max-width:430px;margin:0 auto;
    padding:calc(64px + env(safe-area-inset-top,0px)) 12px
            calc(34px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:30px}

  /* ---------- the card ----------
     the platform's player fills the card; a bar hides its header at the
     top and its caption / buttons at the bottom, so only the video shows */
  .reel{position:relative;width:100%;aspect-ratio:9/16;max-height:76vh;
    border:1px solid var(--line);border-radius:20px;overflow:hidden;
    background:var(--card)}
  .reel iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}

  .reel .lid{position:absolute;left:0;right:0;z-index:3;pointer-events:none;background:var(--card)}
  .reel .lid.t{top:0;height:62px}
  .reel .lid.b{bottom:0;height:142px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
    padding:0 16px 16px;pointer-events:auto;
    background:linear-gradient(180deg,rgba(6,6,7,0) 0%,var(--card) 34%,var(--card) 100%)}

  /* tap-to-play cover */
  .reel .cover{position:absolute;inset:0;z-index:4;cursor:pointer;
    display:grid;place-content:center;justify-items:center;gap:13px;text-align:center;padding:24px}
  .reel .cover .play{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;background:rgba(255,255,255,.03)}
  .reel .cover .play svg{width:20px;height:20px;fill:var(--ink);margin-left:3px}
  .reel .cover .who{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .reel .cover .cap{font-family:var(--serif);font-size:1.05rem;line-height:1.4;max-width:26ch}
  .reel.loaded .cover{display:none}

  /* ---------- love + views, sat on the bottom bar ---------- */
  .love{display:inline-flex;align-items:center;gap:9px;background:none;border:0;
    padding:6px 0;color:var(--ink);font-family:var(--sans);font-size:.8rem;
    cursor:pointer;transition:transform .22s ease,color .25s ease}
  .love:active{transform:scale(.94)}
  .love svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;
    transition:fill .25s ease,stroke .25s ease}
  .love:hover svg{stroke:var(--love)}
  .love.on{color:var(--love)}
  .love.on svg{fill:var(--love);stroke:var(--love)}
  .love .n{font-variant-numeric:tabular-nums;color:var(--dim);transition:color .25s ease}
  .love.on .n{color:var(--love)}
  .views{display:inline-flex;align-items:center;gap:8px;font-size:.58rem;
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .views img{height:18px;display:block;filter:grayscale(1);opacity:.85}

  .note{max-width:430px;margin:30px auto 0;padding:0 16px;
    font-size:.7rem;line-height:1.7;color:#767d86;text-align:center}
</style>
</head>
<body>

<header class="bar">
  <a href="index.html">← Blackveil</a>
  <span class="t">Videos · Demo</span>
</header>

<main class="feed" id="feed"></main>

<p class="note">Demo page — video only, love button, view counter.</p>

<script>
var VIDEOS = [
  {
    platform: 'Instagram', id: 'ig-DZ8_TjEueMy',
    frame: 'https://www.instagram.com/reel/DZ8_TjEueMy/embed/',
    link:  'https://www.instagram.com/reel/DZ8_TjEueMy/'
  },
  {
    platform: 'TikTok', id: 'tt-7614219881206074646',
    frame: 'https://www.tiktok.com/embed/v2/7614219881206074646',
    link:  'https://www.tiktok.com/@swaa4d/video/7614219881206074646'
  }
];

var PLAY = '<span class="play"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></span>';
var HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5l-1.5-1.4C5.2 14.4 2 11.5 2 8a5 5 0 015-5c1.5 0 3 .7 4 1.9A5.3 5.3 0 0115 3a5 5 0 015 5c0 3.5-3.2 6.4-8.5 11.1z"/></svg>';

/* a love saved in this browser (a shared count needs a tiny server) */
function loved(id){ try{ return localStorage.getItem('bv:love:'+id) === '1'; }catch(e){ return false; } }
function setLoved(id, v){ try{ localStorage.setItem('bv:love:'+id, v ? '1':'0'); }catch(e){} }

var VIEWS = 'https://hits.sh/blackveil.space/videos.svg?label=&color=9aa2ab&labelColor=111214&style=flat-square';
var feed = document.getElementById('feed');

VIDEOS.forEach(function (v) {
  var card = document.createElement('div');
  card.className = 'reel';
  card.innerHTML =
    '<span class="lid t"></span>' +
    '<div class="lid b"></div>' +
    '<div class="cover">' + PLAY +
      '<span class="who">' + v.platform + '</span>' +
      '<span class="cap">Tap to play</span>' +
    '</div>';

  var bar = card.querySelector('.lid.b');

  /* love */
  var on = loved(v.id);
  var love = document.createElement('button');
  love.className = 'love' + (on ? ' on' : '');
  love.type = 'button';
  love.setAttribute('aria-pressed', on ? 'true' : 'false');
  love.innerHTML = HEART + '<span class="n">' + (on ? 1 : 0) + '</span>';
  love.addEventListener('click', function (e) {
    e.stopPropagation();
    var now = !love.classList.contains('on');
    love.classList.toggle('on', now);
    love.setAttribute('aria-pressed', now ? 'true' : 'false');
    love.querySelector('.n').textContent = now ? 1 : 0;
    setLoved(v.id, now);
  });

  /* how many views */
  var views = document.createElement('span');
  views.className = 'views';
  views.innerHTML = 'views <img alt="" src="' + VIEWS + '">';

  bar.appendChild(love);
  bar.appendChild(views);

  /* tap the cover → the player drops in */
  card.querySelector('.cover').addEventListener('click', function () {
    if (card.classList.contains('loaded')) return;
    var f = document.createElement('iframe');
    f.src = v.frame;
    f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; clipboard-write');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('scrolling', 'no');
    card.insertBefore(f, card.firstChild);
    card.classList.add('loaded');
  });

  feed.appendChild(card);
});
</script>
</body>
</html>
