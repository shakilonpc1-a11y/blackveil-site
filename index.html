<style>
  :root{
    --bg:#000000;
    --ink:#e9edf1;
    --dim:#848990;
    --faint:rgba(233,237,241,.14);
    --line:rgba(233,237,241,.10);
    --hot:#cfd6dd;
    --serif:"Bodoni Moda",Georgia,serif;
    --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    --gut:clamp(20px,5vw,64px);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  ::selection{background:var(--hot);color:#160a06}
  a{color:inherit}
  .col{width:min(1080px,100%);margin:0 auto;padding-inline:var(--gut)}
  .rule{height:1px;background:var(--line);border:0;margin:0}

  /* ---------- top bar ---------- */
  .bar{
    position:sticky;top:0;z-index:40;
    background:rgba(13,12,11,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar .col{display:flex;align-items:center;justify-content:space-between;height:58px;gap:20px}
  .bar .mark{font-family:var(--serif);font-size:1.05rem;letter-spacing:.01em;flex:0 0 auto}

  /* ---------- live watch ---------- */
  .clock{display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;color:#cfd6dd}
  .clock .dial{width:27px;height:27px;flex:0 0 auto}
  .clock .dial line{transform-origin:20px 20px}
  .clock b{font-family:var(--sans);font-weight:400;font-size:clamp(.58rem,.54rem + .12vw,.68rem);
    letter-spacing:.14em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar nav{display:flex;gap:clamp(12px,2.4vw,28px)}
  .bar nav button{
    background:none;border:0;padding:4px 0;cursor:pointer;
    font-family:var(--sans);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);transition:color .3s ease;
  }
  .bar nav button:hover{color:var(--ink)}

  /* ---------- hero ---------- */
  .hero{padding:clamp(64px,13vh,140px) 0 clamp(40px,8vh,80px)}
  .kicker{
    font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);
    margin:0 0 clamp(18px,3.4vh,30px);
  }
  .name{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(3.6rem,14vw,12rem);line-height:.86;letter-spacing:-.025em;
    margin:0;
  }
  .name .ch{display:inline-block;opacity:0;transform:translateY(.32em);
    animation:up .95s var(--ease) both}
  @keyframes up{to{opacity:1;transform:none}}
  .tag{
    font-family:var(--serif);font-size:clamp(1.25rem,3.2vw,2.1rem);
    line-height:1.3;color:var(--dim);max-width:26ch;
    margin:clamp(24px,5vh,44px) 0 0;
  }
  .tag em{font-style:italic;color:var(--ink)}
  .facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:clamp(22px,4vh,36px)}
  .facts span{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

  /* ---------- sections ---------- */
  .sec{padding:clamp(52px,9vh,104px) 0;border-top:1px solid var(--line)}
  .sec .col{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:clamp(18px,4vw,54px)}
  .lbl{
    font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    position:sticky;top:78px;align-self:start;
  }
  .body{min-width:0}
  .lead{font-family:var(--serif);font-size:clamp(1.05rem,2.3vw,1.5rem);color:var(--dim);
    margin:0 0 clamp(20px,3.6vh,32px);max-width:40ch}
  .lead:empty{display:none}

  /* ---------- quotes ---------- */
  .ql{list-style:none;margin:0;padding:0}
  .ql li{
    font-family:var(--serif);font-size:clamp(1.35rem,3.5vw,2.45rem);line-height:1.24;
    letter-spacing:-.012em;white-space:pre-line;
    padding:clamp(18px,3.4vh,32px) 0;border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(16px);
    transition:opacity .75s var(--ease),transform .75s var(--ease);
  }
  .ql li.in{opacity:1;transform:none}
  .ql li:last-child{border-bottom:0}

  /* ---------- tracks ---------- */
  .tr{list-style:none;margin:0;padding:0}
  .tr li{border-bottom:1px solid var(--line)}
  .tr button{
    width:100%;display:grid;grid-template-columns:32px 1fr auto;align-items:center;
    gap:14px;background:none;border:0;padding:14px 0;text-align:left;cursor:pointer;
    color:var(--ink);font-family:var(--sans);
    transition:padding-left .4s var(--ease),color .3s ease;
  }
  .tr button:hover{padding-left:10px;color:var(--hot)}
  .tr .n{font-size:.68rem;color:var(--dim);font-variant-numeric:tabular-nums}
  .tr .t{font-family:var(--serif);font-size:clamp(1rem,2.1vw,1.2rem);min-width:0}
  .tr .a{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:right}
  .tr button[aria-current="true"] .t,.tr button[aria-current="true"] .n{color:var(--hot)}
  .tr .miss{color:#9aa2ab;letter-spacing:.12em}

  /* ---------- story ---------- */
  .story{display:grid;gap:clamp(22px,4vh,40px)}
  .story article{padding-top:clamp(14px,2.8vh,24px);border-top:1px solid var(--line);
    opacity:0;transform:translateY(16px);
    transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .story article.in{opacity:1;transform:none}
  .story h3{
    font-family:var(--serif);font-weight:400;font-size:clamp(1.1rem,2.5vw,1.65rem);
    letter-spacing:-.01em;margin:0 0 .5em;line-height:1.2;
  }
  .story p{margin:0;color:rgba(233,237,241,.74);max-width:62ch}

  /* ---------- links ---------- */
  .links a{
    display:flex;align-items:baseline;justify-content:space-between;gap:20px;
    padding:clamp(14px,2.8vh,24px) 0;border-bottom:1px solid var(--line);
    text-decoration:none;transition:padding-left .4s var(--ease),color .3s ease;
  }
  .links a:hover{padding-left:12px;color:var(--hot)}
  .links .k{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .links .v{font-family:var(--serif);font-size:clamp(1.15rem,2.9vw,1.85rem);word-break:break-all}
  .links .h{display:block;font-size:.72rem;color:var(--dim);margin-top:3px;letter-spacing:.04em}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);padding:32px 0 44px;
    color:var(--dim);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
  footer .col{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  /* ---------- fixed dock player ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(13,12,11,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .dock .col{display:flex;align-items:center;gap:clamp(10px,2.4vw,26px);height:74px}
  .now{min-width:0;flex:0 1 auto}
  .now b{display:block;font-family:var(--serif);font-weight:400;font-size:1rem;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
  .now i{display:block;font-style:normal;font-size:.62rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
  .ctl{display:flex;gap:7px;flex:0 0 auto}
  .ctl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;
    color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;
    transition:border-color .3s ease,color .3s ease,transform .2s ease}
  .ctl button:hover{border-color:var(--hot);color:var(--hot)}
  .ctl button:active{transform:scale(.94)}
  .ctl svg{width:12px;height:12px;fill:currentColor}
  .seek{flex:1 1 auto;display:flex;align-items:center;gap:10px;min-width:90px;
    font-size:.66rem;color:var(--dim);font-variant-numeric:tabular-nums}
  .track{position:relative;flex:1;height:22px;background:none;border:0;padding:0;cursor:pointer;
    touch-action:none;-webkit-user-select:none;user-select:none}
  .track::before{content:"";position:absolute;top:50%;left:0;right:0;height:1px;
    background:var(--faint);transform:translateY(-50%)}
  .fill{position:absolute;top:50%;left:0;height:1px;width:0;background:var(--hot);transform:translateY(-50%)}
  .knob{position:absolute;top:50%;left:0;width:8px;height:8px;border-radius:50%;background:var(--hot);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .3s ease}
  .track:hover .knob{opacity:1}
  .dock.yt .seek,.dock.yt .pl{display:none}
  .ytbox{position:fixed;right:20px;bottom:92px;width:min(340px,72vw);aspect-ratio:16/9;z-index:45;
    border:1px solid var(--line);background:#000}
  .ytbox[hidden]{display:none}
  .ytbox iframe{width:100%;height:100%;border:0;display:block}

  /* ---------- mobile ---------- */
    body{overflow-x:hidden}
    @media (max-width:760px){
          body{padding-bottom:156px}
          .tr button{grid-template-columns:26px 1fr auto;gap:12px}

          /* top bar — 4 nav items scroll sideways instead of squashing */
          .bar .col{height:52px;gap:12px}
                .bar .mark{font-size:.95rem;flex:0 0 auto}
                .clock{gap:6px}
                .clock .dial{width:22px;height:22px}
          .bar nav{gap:15px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding-block:4px}
          .bar nav::-webkit-scrollbar{display:none}
          .bar nav button{letter-spacing:.13em;white-space:nowrap;flex:0 0 auto}

          /* dock — seek bar gets its own full-width row, fat touch target */
          .dock .col{height:auto;padding-block:11px;gap:10px;flex-wrap:wrap}
          .disc{width:30px;height:30px}
          .now b{max-width:44vw}
          .now i{max-width:44vw}
          .ctl button{width:36px;height:36px}
          .seek{flex:1 1 100%;order:9;min-width:0;gap:8px}
          .track{height:36px}
          .track::before{height:2px}
          .fill{height:2px}
          .knob{opacity:1;width:11px;height:11px}

          .ytbox{right:10px;top:62px;bottom:auto;width:calc(100vw - 20px)}
          .totop{bottom:156px;width:40px;height:40px}
          .foot-links{gap:22px}
          .fbtn .ic{width:44px;height:44px}
          .foot-bottom{justify-content:center;text-align:center;gap:8px}
        }
  /* ---------- motion layer ---------- */
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .glow i{position:absolute;display:block;border-radius:50%;filter:blur(48px);opacity:.85;
    background:radial-gradient(circle,var(--hot) 0%,rgba(207,214,221,.5) 34%,transparent 70%)}
  .glow i:nth-child(1){width:44vw;height:44vw;left:-6vw;top:-10vw;animation:drift1 26s ease-in-out infinite}
  .glow i:nth-child(2){width:36vw;height:36vw;right:-4vw;top:26vh;opacity:.62;animation:drift2 34s ease-in-out infinite}
  .glow i:nth-child(3){width:30vw;height:30vw;left:24vw;bottom:-8vw;opacity:.45;animation:drift3 30s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,4vh,0) scale(1.18)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-7vw,-5vh,0) scale(1.22)}}
  @keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(5vw,-6vh,0) scale(1.15)}}

  .grain{position:fixed;inset:-120%;z-index:1;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grainmove .9s steps(4) infinite}
  @keyframes grainmove{
    0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
    50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(0,0)}}

  #dust{position:fixed;inset:0;z-index:1;pointer-events:none}
  .prog{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;background:var(--hot);
    box-shadow:0 0 12px var(--hot)}
  .spot{position:fixed;width:520px;height:520px;left:0;top:0;z-index:0;pointer-events:none;
    border-radius:50%;opacity:0;transition:opacity .7s ease;
    background:radial-gradient(circle,rgba(207,214,221,.10) 0%,transparent 62%)}
  .bar,.hero,.sec,footer{position:relative;z-index:2}

  /* reveal — rise + clear blur */
  .ql li{filter:blur(9px)}
  .ql li.in{filter:blur(0)}
  .story article{filter:blur(7px)}
  .story article.in{filter:blur(0)}
  .kicker,.tag,.facts{opacity:0;animation:fadeUp 1s var(--ease) forwards}
  .kicker{animation-delay:.9s}.tag{animation-delay:1.15s}.facts{animation-delay:1.4s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* drawing underlines */
  .bar nav button{position:relative}
  .bar nav button::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;
    background:var(--hot);transition:right .35s var(--ease)}
  .bar nav button:hover::after{right:0}
  .links a{position:relative}
  .links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
    background:var(--hot);transition:width .5s var(--ease)}
  .links a:hover::after{width:100%}

  /* little equalizer on the playing row */
  .eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px;width:13px}
  .eq i{display:block;width:2px;background:var(--hot);height:30%;animation:eq .85s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.17s}
  .eq i:nth-child(3){animation-delay:.34s}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}
  /* ---------- level 2 motion ---------- */
  .curtain{position:fixed;inset:0;z-index:200;background:#000000;pointer-events:none;
    animation:curtainOut 1.15s cubic-bezier(.76,0,.24,1) .12s forwards}
  @keyframes curtainOut{to{opacity:0;visibility:hidden}}

  .sec::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;z-index:3;
    background:linear-gradient(90deg,var(--hot),rgba(207,214,221,.14) 55%,transparent);
    transform:scaleX(0);transform-origin:left;transition:transform 1.15s var(--ease)}
  .sec.draw::before{transform:scaleX(1)}

  .ql li{white-space:normal}
  .ql li .w{display:inline-block;opacity:0;transform:translateY(.42em) rotate(1.1deg);
    transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .ql li.in .w{opacity:1;transform:none}

  body.playing .glow{animation:breathe 2.7s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

  .bar nav button,.links a,.tr button{
    transition:transform .3s var(--ease),padding-left .4s var(--ease),color .3s ease}

  .trail{position:fixed;left:0;top:0;width:6px;height:6px;border-radius:50%;pointer-events:none;
    z-index:45;background:var(--hot);filter:blur(1.2px);opacity:0}
  .hero{transition:transform .1s linear,opacity .1s linear;will-change:transform,opacity}

  /* ============ old-version animation layer ============ */
  /* click / touch burst */
  .fx-layer{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .ripple{
    position:absolute;border-radius:50%;
    transform:translate(-50%,-50%) scale(.12);
    border:1.5px solid rgba(var(--c),.9);
    background:radial-gradient(circle,rgba(var(--c),.32),transparent 70%);
    box-shadow:0 0 22px rgba(var(--c),.65), inset 0 0 16px rgba(var(--c),.25);
    animation:rippleOut .78s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rippleOut{
    0%{opacity:.95;transform:translate(-50%,-50%) scale(.12)}
    55%{opacity:.6}
    100%{opacity:0;transform:translate(-50%,-50%) scale(2)}
  }

  /* cursor light — the big soft one */
  .spot{
    position:fixed;top:0;left:0;width:62vmax;height:62vmax;
    margin:-31vmax 0 0 -31vmax;border-radius:50%;
    background:radial-gradient(circle,rgba(210,218,226,.13),rgba(122,134,146,.06) 40%,transparent 66%);
    mix-blend-mode:screen;pointer-events:none;z-index:3;
    opacity:0;transition:opacity .6s ease;will-change:transform;
  }

  /* aurora */
  .aurora{
    position:fixed;top:-35vh;left:50%;width:140vw;height:100vh;z-index:0;
    transform:translateX(-50%);pointer-events:none;filter:blur(46px);
    background:
      radial-gradient(38% 46% at 46% 42%, rgba(210,218,226,.14), transparent 70%),
      radial-gradient(34% 40% at 66% 58%, rgba(150,165,180,.10), transparent 72%);
    animation:aurora 26s ease-in-out infinite alternate;
  }
  @keyframes aurora{
    from{transform:translateX(-50%) translateY(0) scale(1)}
    to{transform:translateX(-53%) translateY(5vh) scale(1.14)}
  }

  /* vignette */
  .vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(130% 78% at 50% -6%, rgba(210,218,226,.07), transparent 62%),
      radial-gradient(150% 105% at 50% 108%, rgba(0,0,0,.9), transparent 58%),
      linear-gradient(180deg, rgba(0,0,0,.35), transparent 28%);
  }

  /* veil intro — two black halves sliding apart */
  .veil{position:fixed;inset:0;z-index:210;pointer-events:none}
  .veil .half{position:absolute;top:0;bottom:0;width:50.5%;background:#000000;
    transition:transform 1.15s cubic-bezier(.76,0,.24,1)}
  .veil .half.l{left:0;box-shadow:26px 0 60px rgba(210,218,226,.07)}
  .veil .half.r{right:0;box-shadow:-26px 0 60px rgba(210,218,226,.07)}
  .veil .seam{position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);
    background:linear-gradient(transparent,rgba(232,238,244,.85),transparent);transition:opacity .55s ease}
  body.ready .veil .half.l{transform:translateX(-101%)}
  body.ready .veil .half.r{transform:translateX(101%)}
  body.ready .veil .seam{opacity:0}

  /* giant watermark behind the hero */
  .hero-mark{
    position:absolute;inset:0;z-index:-1;display:grid;place-items:center;
    font-family:var(--serif);font-size:clamp(9rem,26vw,22rem);line-height:1;
    letter-spacing:-.05em;color:rgba(233,237,241,.04);white-space:nowrap;
    pointer-events:none;user-select:none;opacity:0;transition:opacity 1.6s ease .3s;
  }
  body.ready .hero-mark{opacity:1}

  /* light sweep across the name */
  .name{position:relative}
  .name .sweep{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;border-radius:6px;
    background:linear-gradient(104deg,transparent 38%,rgba(255,226,168,.42) 50%,transparent 62%);
    background-size:260% 100%;background-position:180% 0;
    animation:sweep 5.6s 2.4s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{background-position:180% 0}
    55%{background-position:-60% 0}
    100%{background-position:-60% 0}
  }

  /* progress bar gets the ember→accent gradient */
  .prog{background:linear-gradient(90deg,rgba(207,214,221,.30),var(--hot),#ffffff)}

  .name{
      color:#f4f7fa;
      text-shadow:0 1px 0 rgba(255,255,255,.10),
                  0 2px 8px rgba(0,0,0,.75),
                  0 12px 38px rgba(0,0,0,.85);
    }
  .name .sweep{opacity:.75}

  .bar nav button[aria-current="true"]{color:var(--ink)}

  .totop svg{width:14px;height:14px;fill:currentColor}

    /* ============ horror layer ============ */
    .fog{position:fixed;inset:-20% -12%;z-index:1;pointer-events:none;mix-blend-mode:screen;
      animation:fogBreathe 19s ease-in-out infinite}
    .fog i{position:absolute;display:block;border-radius:50%;filter:blur(80px);
      background:radial-gradient(circle,rgba(126,138,152,.18) 0%,rgba(66,74,84,.10) 46%,transparent 74%)}
    .fog i:nth-child(1){width:72vw;height:44vw;left:-16vw;top:1vh;animation:fog1 48s linear infinite}
    .fog i:nth-child(2){width:64vw;height:40vw;left:38vw;top:24vh;opacity:.85;animation:fog2 66s linear infinite}
    .fog i:nth-child(3){width:82vw;height:48vw;left:-12vw;top:54vh;opacity:.7;animation:fog3 82s linear infinite}
    @keyframes fogBreathe{0%,100%{opacity:.42}50%{opacity:.76}}
    @keyframes fog1{0%{transform:translateX(-12vw)}100%{transform:translateX(26vw)}}
    @keyframes fog2{0%{transform:translateX(18vw)}100%{transform:translateX(-28vw)}}
    @keyframes fog3{0%{transform:translateX(-10vw)}100%{transform:translateX(22vw)}}

    .vignette{position:fixed;inset:0;z-index:5;pointer-events:none;
      background:
        radial-gradient(128% 76% at 50% -4%, rgba(0,0,0,.20), transparent 56%),

    @keyframes flick{

    /* ============ 3D ============ */
    .disc{width:38px;height:38px;flex:0 0 auto;border-radius:50%;position:relative;

        radial-gradient(circle at 50% 50%,
          #1a1d21 0 11%, #0a0b0d 12% 29%,

          #16191d 70% 71%, #0a0b0d 72%);
      box-shadow:inset 0 0 0 1px rgba(233,237,241,.10), 0 8px 18px rgba(0,0,0,.65);
      transform:perspective(340px) rotateX(56deg)}

      background:var(--hot);opacity:.8;box-shadow:0 0 10px var(--hot)}
    body.playing .disc{animation:spin 3.6s linear infinite}
    @keyframes spin{to{transform:perspective(340px) rotateX(56deg) rotateZ(360deg)}}
    .name{letter-spacing:-.02em}

    footer .col.foot-inner{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
      footer{padding:clamp(44px,8vh,76px) 0 46px}

        font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
      .fbtn .ic img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;
        filter:grayscale(1) contrast(1.05) brightness(.92);transition:filter .35s ease}
      .fbtn:hover .ic img{filter:grayscale(1) contrast(1.05) brightness(1.18)}

  /* ============ photographic horror background ============ */
  .bgphoto{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#000}
  .bgphoto i{position:absolute;inset:-8%;display:block;
      background:url("bg-horror-dark.jpg") center 56%/cover no-repeat;
      opacity:.96;will-change:transform;
      animation:bgdrift 52s ease-in-out infinite alternate}
  @keyframes bgdrift{
    0%{transform:scale(1.02) translate3d(-1.4%,0,0)}

  }
  .bgphoto::after{content:"";position:absolute;inset:0;
      background:
        radial-gradient(132% 78% at 50% 4%, rgba(0,0,0,.64), transparent 62%),
                linear-gradient(180deg, rgba(0,0,0,.50) 0%, rgba(0,0,0,.16) 28%, rgba(0,0,0,.40) 62%, rgba(0,0,0,.82) 100%)}

          /* phones get the tall version of the picture, so far less of it is cropped away */

                  /* ============ lite mode — keeps scrolling smooth on phones ============ */

      .foot-links{display:inline-flex;align-items:flex-start;gap:clamp(14px,3vw,30px);

    /* ============ clean rhythm & readability ============ */
      body{font-size:16.5px;line-height:1.72}

  .lbl .num{color:#cfd6dd;opacity:.55;margin-right:10px;font-variant-numeric:tabular-nums}

      .lead{font-size:clamp(1.05rem,2.05vw,1.32rem);line-height:1.5;color:#9aa0a8;

      /* hero */
      .hero{padding:clamp(84px,17vh,190px) 0 clamp(60px,11vh,120px)}

      .story{gap:clamp(38px,6.5vh,70px)}

      /* the closing line stands on its own */
      #closingLine{font-size:clamp(1.05rem,2.1vw,1.35rem);line-height:1.55;max-width:40ch}

      /* footer */
      footer{padding:clamp(68px,11vh,112px) 0 58px}

      /* quieter noise so the words stay the focus */
      .grain{opacity:.032}

      /* ============ text clarity pass ============ */
        /* heavier strokes — thin light text was getting lost on the photo */
        body{font-weight:400}
        .ql li{font-weight:400;color:#f7f9fc}
        .tag{font-weight:400}
        .lead{color:#aab1b9}
        .story h3{font-weight:400;color:#f2f5f9}
        .story p{font-size:1.07rem;color:rgba(242,246,250,.90)}
        .tr .t{font-weight:400;color:#f2f5f9}
        .tr .a{color:#9ba2ab}
        .lbl,.kicker{color:#98a0a9}
        .foot-lead{color:#a7aeb6}

        /* soft frosted scrim so the photo's grain stops competing with the words
           (fades out at the edges — no visible box) */
        .sec .body{position:relative}
        .sec .body::before{
          content:"";position:absolute;inset:-34px -38px;z-index:-1;border-radius:30px;
          background:rgba(0,0,0,.46);

          pointer-events:none;
        }

        /* ============ one layout for every screen ============ */
          /* a single centred column — desktop and phone now look the same,

          .col{width:min(820px,100%);margin:0 auto;padding-inline:clamp(18px,5vw,32px)}

          /* no more two-column split — the label sits above the content everywhere */
          .sec .col{display:block}
          .lbl{display:block;position:static;margin:0 0 clamp(16px,2.6vh,26px)}

          /* ---- type system: smaller, with clear font roles ---- */
                    /* Bodoni = display & quotes · Manrope = labels, body, meta */

                      font-optical-sizing:auto}

                    .kicker{font-size:clamp(.6rem,.55rem + .12vw,.66rem);letter-spacing:.28em}
                    .lbl{font-size:clamp(.6rem,.55rem + .12vw,.66rem);letter-spacing:.26em;font-weight:500}

                    /* the small line under each label */
                    .lead{font-size:clamp(.94rem,.88rem + .3vw,1.08rem);line-height:1.62;max-width:48ch}

                    /* quotes — smaller, calm, generous spacing */
                    .ql li{font-size:clamp(1.12rem,.96rem + .82vw,1.48rem);line-height:1.5;
                      letter-spacing:0;font-weight:400;max-width:min(100%,24em);
                      padding:clamp(22px,3.4vh,38px) 0;font-variation-settings:"opsz" 36}

                    /* story */
                    .story h3{font-size:clamp(1.02rem,.9rem + .5vw,1.3rem);line-height:1.3}
                    .story p{font-size:clamp(.95rem,.9rem + .25vw,1.04rem);line-height:1.85;max-width:58ch}

                    /* tracklist */
                    .tr .t{font-size:clamp(.95rem,.88rem + .34vw,1.06rem)}

                    /* closing + footer */
                    #closingLine{font-size:clamp(1rem,.9rem + .45vw,1.22rem)}
                    .foot-head{font-size:clamp(.58rem,.54rem + .1vw,.64rem);letter-spacing:.28em}
                    .foot-lead{font-size:clamp(.98rem,.9rem + .35vw,1.2rem)}
                    .foot-bottom{font-size:clamp(.56rem,.52rem + .1vw,.62rem)}
                    .foot-links .v{font-size:clamp(.88rem,.82rem + .3vw,1rem)}
                    .fbtn .cap{font-size:clamp(.56rem,.52rem + .1vw,.62rem)}

                    /* rhythm — tighter now that the type is smaller */
                    .sec{padding:clamp(48px,6vw,88px) 0}
                    .hero{padding:clamp(58px,7.5vw,120px) 0 clamp(38px,5vw,76px)}

                    /* ============ phones: bigger words, tidy two-row top bar ============ */
                    @media (max-width:760px){
                                /* give the words more of the screen */
                                .col{padding-inline:13px}

                                /* type that scales with the screen — a small phone gets smaller
                                   text, so nothing has to be zoomed out to fit */
                                body{font-size:clamp(13.5px,4.6vw,16.4px)}
                                .name{font-size:clamp(30px,11.5vw,45px);line-height:.95}
                                .tag{font-size:clamp(13px,4.25vw,18px)}
                                .ql li{font-size:clamp(15px,5.15vw,21px);line-height:1.42;padding:17px 0}

                                                          justify-content:space-between;
                                                          overflow:visible;padding-bottom:2px}
                                  .bar nav button{font-size:.58rem;letter-spacing:.09em;white-space:nowrap;flex:0 0 auto}
                    }

                    @media (prefers-reduced-motion:reduce){
                      *{animation:none!important;transition:none!important}
    .ql li,.story article,.name .ch,.kicker,.tag,.facts,.ql li .w{opacity:1!important;transform:none!important;filter:none!important}

  var songs = C.songs || [];

  var pv = $('prev'), nx = $('next');
  function step(d){

  if('mediaSession' in navigator){

      navigator.mediaSession.setActionHandler('seekforward', function(){

  }
  var sk = $('seek');
    if(sk){

  /* ---------- story ---------- */
  (function(){

    (C.story||[]).forEach(function(s){

      if(s.title){ var h = document.createElement('h3'); h.textContent = s.title; a.appendChild(h); }
      var p = document.createElement('p'); p.textContent = s.text || ''; a.appendChild(p);
      box.appendChild(a);

  })();

  /* ---------- links + closing + footer ---------- */
    var ICONS = {
      x: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
      telegram: '<svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>',
      channel: '<svg viewBox="0 0 24 24"><path d="M3 10v4h3l5 4V6L6 10H3zm12.5 2c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM13 3.2v1.7c2.9 1 5 3.8 5 7.1s-2.1 6.1-5 7.1v1.7c3.9-1.1 6.5-4.7 6.5-8.8S16.9 4.3 13 3.2z"/></svg>',
      link: '<svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l1.4-1.4a1 1 0 0 1 1.4 1.4l-1.4 1.4a1 1 0 0 1-1.4 0zM7.8 16.2a4 4 0 0 1 0-5.6l2.1-2.1 1.4 1.4-2.1 2.1a2 2 0 0 0 2.8 2.8l2.1-2.1 1.4 1.4-2.1 2.1a4 4 0 0 1-5.6 0zm8.4-8.4a4 4 0 0 1 0 5.6l-2.1 2.1-1.4-1.4 2.1-2.1a2 2 0 0 0-2.8-2.8l-2.1 2.1-1.4-1.4 2.1-2.1a4 4 0 0 1 5.6 0z"/></svg>'
    };
    function iconFor(label){
      var s = String(label || '').toLowerCase();
      if(s === 'x' || s.indexOf('x') === 0) return ICONS.x;
      if(s.indexOf('telegram') > -1 || s.indexOf('tg') > -1) return ICONS.telegram;

<script>
/* ============ device check: keep phones smooth ============ */
(function(){
  try{
    var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    var cores = navigator.hardwareConcurrency || 8;
    var mem = navigator.deviceMemory || 8;
    if(touch || cores <= 4 || mem <= 4){
      document.documentElement.className += ' lite';
      if(document.body) document.body.className += ' lite';
      window.__lite = true;
    }
  }catch(e){}
})();

/* ================= motion layer ================= */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* soft drifting glows */
  var glow = document.createElement('div');
  glow.className = 'glow';
  glow.innerHTML = '<i></i><i></i><i></i>';
  document.body.appendChild(glow);

  /* animated film grain */
  var grain = document.createElement('div');
  grain.className = 'grain';
  document.body.appendChild(grain);

  if(!reduce){
      /* cursor light — pointer only, skipped on phones */
      if(!window.__lite){
      var spot = document.createElement('div');
    spot.className = 'spot';
    document.body.appendChild(spot);
    var sx = 0, sy = 0, tx = 0, ty = 0, on = false;
    document.addEventListener('mousemove', function(e){
      tx = e.clientX; ty = e.clientY;
      if(!on){ on = true; spot.style.opacity = '.9'; sx = tx; sy = ty; }
    }, {passive:true});
    (function follow(){
      sx += (tx - sx) * 0.12; sy += (ty - sy) * 0.12;
      spot.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0)';
      requestAnimationFrame(follow);
          })();
          }

          /* reading progress */
    var prog = document.createElement('div');
    prog.className = 'prog';
    document.body.appendChild(prog);
    function paintProg(){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      prog.style.width = (h > 0 ? Math.min(100, Math.max(0, window.scrollY / h * 100)) : 0) + '%';
    }
    addEventListener('scroll', paintProg, {passive:true});
    addEventListener('resize', paintProg);
    paintProg();

    /* floating dust — tinted with the theme accent */
    var accent = '#cfd6dd';
    try{
      var v = getComputedStyle(document.documentElement).getPropertyValue('--hot').trim();
      if(v){ accent = v; }
    }catch(e){}
    var rgb = [207,214,221];
    var m = accent.replace('#','');
    if(m.length === 3) m = m[0]+m[0]+m[1]+m[1]+m[2]+m[2];
    if(m.length === 6){
      var n = parseInt(m, 16);
      if(!isNaN(n)) rgb = [(n>>16)&255, (n>>8)&255, n&255];
    }

    var cv = document.createElement('canvas');
    cv.id = 'dust';
    document.body.appendChild(cv);
    var g = cv.getContext('2d'), W = 0, H = 0, ps = [];
    function size(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
    size();
    addEventListener('resize', size);
    var N = window.__lite ? 12 : (window.innerWidth < 720 ? 26 : 48);
    for(var i=0;i<N;i++){
      ps.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.7 + 0.8,
        vy: -(Math.random()*0.26 + 0.08),
        vx: (Math.random()-0.5)*0.18,
        a: Math.random()*0.4 + 0.2
      });
    }
    var lastDraw = 0;
        (function loop(now){
          if(window.__lite && now - lastDraw < 45){ requestAnimationFrame(loop); return; }
          lastDraw = now || 0;
          g.clearRect(0,0,W,H);
      for(var i=0;i<ps.length;i++){
        var p = ps[i];
        g.beginPath();
        g.arc(p.x, p.y, p.r, 0, 6.2832);
        g.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + p.a.toFixed(2) + ')';
        g.fill();
        var sp = document.body.classList.contains('playing') ? 1.8 : 1;
        p.y += p.vy * sp; p.x += p.vx * sp;
        if(p.y < -10){ p.y = H + 10; p.x = Math.random()*W; }
        if(p.x < -10) p.x = W + 10;
        if(p.x > W + 10) p.x = -10;
      }
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
<script>
/* ================= level 2 motion ================= */
(function(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  /* --- photographic horror background, drifting slowly --- */
  var bgp = document.createElement('div');
  bgp.className = 'bgphoto';
  bgp.innerHTML = '<i></i>';
  document.body.appendChild(bgp);

  /* --- veil intro: two halves slide apart --- */
  var veil = document.createElement('div');
  veil.className = 'veil';
  veil.innerHTML = '<div class="half l"></div><div class="half r"></div><div class="seam"></div>';
  document.body.appendChild(veil);
  requestAnimationFrame(function(){
    setTimeout(function(){ document.body.classList.add('ready'); }, 90);
    setTimeout(function(){ if(veil.parentNode) veil.parentNode.removeChild(veil); }, 1550);
  });

  /* --- section rules draw in --- */
  var secs = document.querySelectorAll('.sec');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('draw'); io.unobserve(e.target); } });
    }, {threshold:0.08});
    Array.prototype.forEach.call(secs, function(s){ io.observe(s); });
  } else {
    Array.prototype.forEach.call(secs, function(s){ s.classList.add('draw'); });
  }

  /* --- quotes reveal word by word --- */
  Array.prototype.forEach.call(document.querySelectorAll('#quotes li'), function(li){
    var raw = li.textContent;
    li.textContent = '';
    var wi = 0;
    raw.split(/(\n+)/).forEach(function(part){
      if(/^\n+$/.test(part)){
        for(var k=0;k<part.length;k++) li.appendChild(document.createElement('br'));
        return;
      }
      part.split(/(\s+)/).forEach(function(tok){
        if(!tok) return;
        if(/^\s+$/.test(tok)){ li.appendChild(document.createTextNode(' ')); return; }
        var s = document.createElement('span');
        s.className = 'w';
        s.textContent = tok;
        s.style.transitionDelay = (wi++ * 0.042).toFixed(3) + 's';
        li.appendChild(s);
      });
    });
  });

  /* --- word-by-word hover on the big name --- */
  Array.prototype.forEach.call(document.querySelectorAll('.name .ch'), function(ch){
    ch.style.transition = 'transform .35s cubic-bezier(.22,.61,.36,1), color .35s ease';
    ch.addEventListener('mouseenter', function(){ ch.style.transform = 'translateY(-.12em)'; ch.style.webkitTextFillColor = '#ffffff'; });
        ch.addEventListener('mouseleave', function(){ ch.style.transform = ''; ch.style.webkitTextFillColor = ''; });
  });

  /* --- hero parallax --- */
  var hero = document.querySelector('.hero');
  var nameEl = document.getElementById('name');
  var ticking = false;

  function onScroll(){
    var y = window.scrollY;
    if(hero){
      var p = Math.min(1, y / 640);
      hero.style.transform = 'translateY(' + (-p * 44).toFixed(1) + 'px)';
      hero.style.opacity = (1 - p * 0.88).toFixed(3);
    }
    if(nameEl && !window.__lite){
          var p2 = Math.min(1, y / 640);
      nameEl.style.letterSpacing = (-0.025 + p2 * 0.055).toFixed(4) + 'em';
    }
    ticking = false;
  }
  addEventListener('scroll', function(){
    if(!ticking){ ticking = true; requestAnimationFrame(onScroll); }
  }, {passive:true});

  /* --- magnetic hover --- */
  Array.prototype.forEach.call(document.querySelectorAll('.tr button'), function(el){
    el.addEventListener('mousemove', function(e){
      var r = el.getBoundingClientRect();
      var mx = (e.clientX - r.left - r.width / 2) / (r.width / 2);
      var my = (e.clientY - r.top - r.height / 2) / (r.height / 2);
      el.style.transform = 'perspective(760px) rotateY(' + (mx * 4).toFixed(2) + 'deg) rotateX('
        + (-my * 3).toFixed(2) + 'deg) translate(' + (mx * 2).toFixed(1) + 'px,' + (my * 1).toFixed(1) + 'px)';
    });
    el.addEventListener('mouseleave', function(){ el.style.transform = ''; });
  });

  /* --- cursor trail (mouse only) --- */
    var pts = [];
    if(!window.__lite){
  for(var i=0;i<8;i++){
    var d = document.createElement('div');
    d.className = 'trail';
    document.body.appendChild(d);
    pts.push({el:d, x:0, y:0});
  }
  var mx = 0, my = 0, seen = false;
  document.addEventListener('mousemove', function(e){
    mx = e.clientX; my = e.clientY;
    if(!seen){ seen = true; pts.forEach(function(p){ p.x = mx; p.y = my; }); }
  }, {passive:true});
  (function trailLoop(){
    var px = mx, py = my;
    for(var i=0;i<pts.length;i++){
      var p = pts[i];
      p.x += (px - p.x) * 0.34;
      p.y += (py - p.y) * 0.34;
      p.el.style.transform = 'translate(' + (p.x - 3).toFixed(1) + 'px,' + (p.y - 3).toFixed(1) + 'px)';
      p.el.style.opacity = Math.max(0, 0.34 - i * 0.038).toFixed(3);
      px = p.x; py = p.y;
    }
    requestAnimationFrame(trailLoop);
      })();
      }

  /* --- aurora + vignette --- */
  var aur = document.createElement('div');
  aur.className = 'aurora';
  document.body.appendChild(aur);
  var vig = document.createElement('div');
    vig.className = 'vignette';
    document.body.appendChild(vig);

    /* --- horror: drifting fog + light flicker --- */
    var fog = document.createElement('div');
    fog.className = 'fog';
    fog.innerHTML = '<i></i><i></i><i></i>';
    document.body.appendChild(fog);
    var flk = document.createElement('div');
    flk.className = 'flicker';
    document.body.appendChild(flk);

  /* --- giant watermark behind the hero --- */
  var heroBox = document.querySelector('.hero');
  if(heroBox){
    var hm = document.createElement('div');
    hm.className = 'hero-mark';
    hm.textContent = (window.CONTENT && window.CONTENT.name) || 'Blackveil';
    heroBox.appendChild(hm);
  }

  /* --- light sweep across the name --- */
  var nm = document.getElementById('name');
  if(nm){
    var sw = document.createElement('span');
    sw.className = 'sweep';
    nm.appendChild(sw);
  }

  /* --- click / touch burst (colour splashes) ---
       এখন বন্ধ। আবার চালু করতে নিচের লাইনে true করুন। */
    var CLICK_FX = false;
    if(CLICK_FX){
      var layer = document.createElement('div');
      layer.className = 'fx-layer';
      document.body.appendChild(layer);
      var COLORS = ['143,208,232', '255,157,107', '143,227,176', '232,201,143',
                    '214,222,230', '255,255,255', '196,146,255'];
      document.addEventListener('pointerdown', function(e){
        var c = COLORS[(Math.random() * COLORS.length) | 0];
        var size = 52 + Math.random() * 36;
        var d = document.createElement('span');
        d.className = 'ripple';
        d.style.setProperty('--c', c);
        d.style.left = e.clientX + 'px';
        d.style.top = e.clientY + 'px';
        d.style.width = size + 'px';
        d.style.height = size + 'px';
        layer.appendChild(d);
        setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 840);
      }, {passive:true});
    }

  /* --- 3D: the big name leans with the cursor --- */
  var nm3 = document.getElementById('name');
    if(nm3 && !window.__lite){
    var lx = 0, ly = 0, tlx = 0, tly = 0;
    document.addEventListener('mousemove', function(e){
      var nx = (e.clientX / window.innerWidth) * 2 - 1;
      var ny = (e.clientY / window.innerHeight) * 2 - 1;
      tly = nx * 4.2;
      tlx = -ny * 2.2;
    }, {passive:true});
    (function lean(){
      lx += (tlx - lx) * 0.06;
      ly += (tly - ly) * 0.06;
      if(Math.abs(lx) > 0.01 || Math.abs(ly) > 0.01){
        nm3.style.transform = 'perspective(1100px) rotateX(' + lx.toFixed(2)
          + 'deg) rotateY(' + ly.toFixed(2) + 'deg)';
      }
      requestAnimationFrame(lean);
    })();
  }

  /* --- page breathes while the music plays --- */
  var audio = document.getElementById('audio');
  if(audio){
    audio.addEventListener('play',  function(){ document.body.classList.add('playing'); });
    audio.addEventListener('pause', function(){ document.body.classList.remove('playing'); });
    audio.addEventListener('ended', function(){ document.body.classList.remove('playing'); });
  }
})();
</script>
<script>
/* ============ extras: keys · memory · top · spy ============ */
(function(){
  var rows = document.querySelectorAll('#tracks button');

  /* --- live watch (real time) --- */
  (function(){
    var hH = document.getElementById('hHand');
    var mH = document.getElementById('mHand');
    var sH = document.getElementById('sHand');
    var out = document.getElementById('clockTime');
    if(!out) return;
    function pad(n){ return (n < 10 ? '0' : '') + n; }
    function tick(){
          var d = new Date();
          var hh = d.getHours(), mm = d.getMinutes(), ss = d.getSeconds();
          var h12 = hh % 12; if(h12 === 0) h12 = 12;
          out.textContent = pad(h12) + ':' + pad(mm) + ':' + pad(ss) + ' ' + (hh < 12 ? 'AM' : 'PM');
          if(sH) sH.style.transform = 'rotate(' + (ss * 6) + 'deg)';
          if(mH) mH.style.transform = 'rotate(' + (mm * 6 + ss * 0.1) + 'deg)';
          if(hH) hH.style.transform = 'rotate(' + ((hh % 12) * 30 + mm * 0.5) + 'deg)';
        }
    tick();
    setInterval(tick, 1000);
  })();

  /* --- offline & installable (PWA) --- */
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  /* --- keyboard shortcuts --- */
  document.addEventListener('keydown', function(e){
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if(e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      var b = document.getElementById('toggle'); if(b) b.click();
    } else if(e.key === 'ArrowLeft'){
      var p = document.getElementById('prev'); if(p) p.click();
    } else if(e.key === 'ArrowRight'){
      var n = document.getElementById('next'); if(n) n.click();
    }
  });

  /* --- remember the last track --- */
  var KEY = 'bv:track';
  function currentIndex(){
    for(var i=0;i<rows.length;i++) if(rows[i].getAttribute('aria-current') === 'true') return i;
    return -1;
  }
  function save(){
    var i = currentIndex();
    if(i >= 0){ try{ localStorage.setItem(KEY, String(i)); }catch(e){} }
  }
  var saved = -1;
  try{
    var v = localStorage.getItem(KEY);
    if(v !== null) saved = parseInt(v, 10);
  }catch(e){}

  if(saved > 0 && saved < rows.length){
    rows[saved].click();
    setTimeout(function(){
      var a = document.getElementById('audio');
      if(a && !a.paused) a.pause();
    }, 450);
  }
  var au = document.getElementById('audio');
  if(au) au.addEventListener('play', function(){ setTimeout(save, 80); });
  document.addEventListener('click', function(e){
    if(!e.target || !e.target.closest) return;
    if(e.target.closest('#tracks button, #prev, #next')) setTimeout(save, 120);
  });

  /* --- back to top --- */
  var top = document.createElement('button');
  top.type = 'button';
  top.className = 'totop';
  top.setAttribute('aria-label', 'Back to top');
  top.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 3l6 6-1.4 1.4L9 6.8V14H7V6.8L3.4 10.4 2 9z"/></svg>';
  document.body.appendChild(top);
  top.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
  function toggleTop(){ if(window.scrollY > 700) top.classList.add('show'); else top.classList.remove('show'); }
  addEventListener('scroll', toggleTop, {passive:true});
  toggleTop();

  /* --- scroll spy on the nav --- */
  var navs = document.querySelectorAll('#nav button');
    if(navs.length && 'IntersectionObserver' in window){
      var pairs = [];
      Array.prototype.forEach.call(navs, function(b){
        var el = document.getElementById(b.getAttribute('data-target') || '');
        if(el) pairs.push({ btn: b, el: el });
      });
      var io = new IntersectionObserver(function(es){
        es.forEach(function(en){
          if(en.isIntersecting){
            Array.prototype.forEach.call(pairs, function(p){
              if(p.el === en.target) p.btn.setAttribute('aria-current', 'true');
              else p.btn.removeAttribute('aria-current');
            });
          }
        });
      }, {rootMargin:'-40% 0px -40% 0px', threshold:0});
      Array.prototype.forEach.call(pairs, function(p){ io.observe(p.el); });

      /* at the very bottom, light up the last one (Find Me) */
      addEventListener('scroll', function(){
        if(window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 6){
          Array.prototype.forEach.call(navs, function(b, j){
            if(j === navs.length - 1) b.setAttribute('aria-current', 'true');
            else b.removeAttribute('aria-current');
          });
        }
      }, {passive:true});
    }
})();
</script>
</body>
</html>
