<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Story</title>
<meta name="description" content="A personal story, told in motion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Sora:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --ink:#f5f1ea;
    --muted:#968e83;
    --line:rgba(245,241,234,.12);
    --accent:#e9a340;
    --accent-soft:rgba(233,163,64,.14);
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
    --pad:clamp(20px,5vw,72px);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:300;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:#171106}

  /* ---------- ambient layers ---------- */
  #dust{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:0;
  }
  .glow{
    position:fixed;
    top:-32vh;left:50%;
    width:130vw;height:95vh;
    transform:translateX(-50%);
    background:radial-gradient(45% 55% at 50% 45%, rgba(233,163,64,.20), transparent 68%);
    filter:blur(30px);
    pointer-events:none;
    z-index:0;
    animation:drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{transform:translateX(-50%) translateY(0) scale(1)}
    to{transform:translateX(-52%) translateY(4vh) scale(1.08)}
  }

  .progress{
    position:fixed;top:0;left:0;height:2px;width:0%;
    background:linear-gradient(90deg,var(--accent), #f6d99a);
    z-index:20;
  }

  /* ---------- layout shell ---------- */
  .wrap{
    position:relative;z-index:1;
    width:min(1180px,100%);
    margin:0 auto;
    padding-inline:var(--pad);
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;z-index:1;
    min-height:100svh;
    display:flex;
    align-items:flex-end;
    padding-block:clamp(80px,14vh,150px) clamp(48px,9vh,90px);
  }
  .eyebrow{
    font-size:.72rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 clamp(14px,3vh,28px);
    display:flex;align-items:center;gap:14px;
    animation:fadeUp .9s .1s both cubic-bezier(.2,.7,.2,1);
  }
  .eyebrow::after{
    content:"";flex:1;height:1px;max-width:180px;
    background:linear-gradient(90deg,var(--accent),transparent);
  }

  .name{
    font-family:var(--display);
    font-weight:600;
    font-style:italic;
    font-size:clamp(3.4rem,13.5vw,11.5rem);
    line-height:.92;
    letter-spacing:-.03em;
    margin:0;
    font-variation-settings:"opsz" 144;
    text-wrap:balance;
  }
  .name .ln{display:block;overflow:hidden;padding-bottom:.06em}
  .name .ch{
    display:inline-block;
    transform:translateY(112%) rotate(3deg);
    animation:rise 1.15s cubic-bezier(.19,.9,.28,1) both;
  }
  @keyframes rise{to{transform:translateY(0) rotate(0)}}

  .tagline{
    font-size:clamp(1rem,2.1vw,1.32rem);
    color:var(--muted);
    max-width:46ch;
    margin:clamp(20px,4vh,34px) 0 0;
    animation:fadeUp 1s 1.1s both cubic-bezier(.2,.7,.2,1);
  }
  .tagline em{color:var(--ink);font-style:normal;border-bottom:1px solid var(--accent-soft)}

  .hero-foot{
    margin-top:clamp(34px,7vh,64px);
    display:flex;justify-content:space-between;align-items:center;
    gap:20px;
    animation:fadeUp 1s 1.4s both cubic-bezier(.2,.7,.2,1);
  }
  .scroll-cue{
    font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:10px;
  }
  .scroll-cue::before{
    content:"";width:1px;height:44px;
    background:linear-gradient(var(--accent),transparent);
    animation:cue 2.4s ease-in-out infinite;
  }
  @keyframes cue{0%,100%{opacity:.35;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}

  @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  /* ---------- sections ---------- */
  section{padding-block:clamp(72px,14vh,150px)}

  .section-head{
    display:flex;align-items:baseline;gap:clamp(14px,3vw,34px);
    padding-bottom:clamp(20px,4vh,36px);
    border-bottom:1px solid var(--line);
  }
  .section-head .idx{
    font-size:.72rem;letter-spacing:.28em;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .section-head h2{
    font-family:var(--display);font-weight:400;
    font-size:clamp(1.7rem,4.4vw,3.1rem);
    letter-spacing:-.02em;margin:0;line-height:1.05;
  }

  /* ---------- quotes (scroll-driven, pinned) ---------- */
  .quote-track{position:relative;height:calc(var(--nq,5) * 85svh)}
  .quote-sticky{
    position:sticky;top:0;
    height:100svh;
    display:flex;align-items:center;
  }
  .quote-sticky .wrap{width:100%}
  .quote-stage{
    position:relative;
    margin:0;
    padding-left:clamp(20px,4.5vw,52px);
    border-left:1px solid var(--accent-soft);
    min-height:clamp(150px,26vh,230px);
    display:flex;align-items:center;
  }
  .quote-stage::before{
    content:"“";
    position:absolute;left:clamp(12px,3vw,40px);top:-.36em;
    font-family:var(--display);font-size:clamp(4rem,12vw,9rem);
    color:var(--accent);opacity:.2;line-height:1;
    pointer-events:none;
  }
  #quoteText{
    font-family:var(--display);font-weight:300;
    font-size:clamp(1.5rem,4.4vw,3.1rem);
    line-height:1.24;letter-spacing:-.018em;
    margin:0;
    text-wrap:pretty;
    opacity:0;transform:translateY(16px);
    transition:opacity .45s cubic-bezier(.2,.7,.2,1),
               transform .45s cubic-bezier(.2,.7,.2,1);
  }
  #quoteText.in{opacity:1;transform:none}

  .q-meter{
    margin:clamp(24px,5vh,44px) 0 0 clamp(20px,4.5vw,52px);
    height:1px;background:var(--line);position:relative;max-width:560px;
  }
  .q-meter span{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--accent);
    transition:width .5s cubic-bezier(.2,.7,.2,1);
  }
  .q-count{
    margin:14px 0 0 clamp(20px,4.5vw,52px);
    display:flex;align-items:center;gap:8px;
    font-size:.72rem;letter-spacing:.26em;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .q-count #qIdx{color:var(--accent)}
  .q-sep{opacity:.5}

  /* ---------- closing ---------- */
  .closing-line{
    font-family:var(--display);font-weight:400;
    font-size:clamp(1.3rem,3.4vw,2.35rem);
    line-height:1.32;letter-spacing:-.015em;
    max-width:40ch;margin:clamp(38px,7vh,72px) 0 0;
    text-wrap:pretty;
  }
  .closing-line strong{
    font-weight:600;font-style:italic;
    color:var(--accent);
  }

  footer{
    position:relative;z-index:1;
    border-top:1px solid var(--line);
    padding:clamp(28px,5vh,44px) 0 clamp(34px,6vh,56px);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  }

  /* ---------- soundtrack ---------- */
  .player{
    margin-top:clamp(30px,6vh,56px);
    border:1px solid var(--line);
    padding:clamp(18px,3.4vw,30px);
    background:linear-gradient(180deg,rgba(245,241,234,.03),transparent 70%);
  }
  .player-top{
    display:flex;align-items:center;justify-content:space-between;
    gap:clamp(16px,4vw,40px);flex-wrap:wrap;
  }
  .np{display:flex;align-items:center;gap:clamp(14px,3vw,24px);min-width:0;flex:1}
  .bars{display:flex;align-items:flex-end;gap:3px;height:36px;flex:0 0 auto}
  .bars i{
    display:block;width:3px;height:100%;border-radius:2px;
    background:var(--muted);opacity:.3;
    transform:scaleY(.22);transform-origin:bottom;
    transition:background .45s ease,opacity .45s ease;
  }
  .player.playing .bars i{
    background:var(--accent);opacity:1;
    animation:eq 1.05s ease-in-out infinite;
  }
  @keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
  .np-meta{min-width:0}
  .np-title{
    display:block;font-family:var(--display);font-weight:500;
    font-size:clamp(1.02rem,2.2vw,1.4rem);letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch;
  }
  .np-artist{
    display:block;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin-top:2px;
  }
  .controls{display:flex;align-items:center;gap:clamp(8px,1.6vw,14px)}
  .ctl{
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--line);background:none;color:var(--ink);
    display:grid;place-items:center;cursor:pointer;padding:0;
    transition:border-color .3s ease,color .3s ease,transform .3s ease;
  }
  .ctl svg{width:15px;height:15px;fill:currentColor}
  .ctl:hover{border-color:var(--accent);color:var(--accent)}
  .ctl:active{transform:scale(.94)}
  .ctl.play{width:58px;height:58px;border-color:var(--accent);color:var(--accent)}
  .ctl.play svg{width:18px;height:18px}
  .ctl:disabled{opacity:.28;cursor:not-allowed}
  .ctl:disabled:hover{border-color:var(--line);color:var(--ink)}

  .seek{
    display:flex;align-items:center;gap:14px;margin-top:22px;
    font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .track{position:relative;flex:1;height:24px;background:none;border:0;padding:0;cursor:pointer}
  .track::before{
    content:"";position:absolute;top:50%;left:0;right:0;height:1px;
    background:var(--line);transform:translateY(-50%);
  }
  .track .fill{
    position:absolute;top:50%;left:0;height:1px;width:0%;
    background:var(--accent);transform:translateY(-50%);
  }
  .track .knob{
    position:absolute;top:50%;left:0;width:9px;height:9px;border-radius:50%;
    background:var(--accent);transform:translate(-50%,-50%);
    opacity:0;transition:opacity .3s ease;
  }
  .track:hover .knob,.track:focus-visible .knob{opacity:1}

  .tracks{list-style:none;margin:clamp(20px,4vh,32px) 0 0;padding:0;border-top:1px solid var(--line)}
  .tracks li{border-bottom:1px solid var(--line)}
  .trow{
    display:grid;grid-template-columns:42px 1fr auto;align-items:center;
    gap:clamp(10px,2.5vw,20px);width:100%;padding:15px 2px;
    background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;
    font-family:var(--sans);font-weight:300;
    transition:padding-left .4s cubic-bezier(.2,.7,.2,1),color .3s ease;
  }
  .trow:hover{padding-left:14px;color:var(--accent)}
  .trow:disabled{cursor:not-allowed}
  .trow .tn{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .trow .tt{
    font-family:var(--display);font-size:clamp(.98rem,1.9vw,1.18rem);
    letter-spacing:-.01em;min-width:0;
  }
  .trow .ta{
    font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);text-align:right;
  }
  .trow[aria-current="true"] .tt,.trow[aria-current="true"] .tn{color:var(--accent)}
  .trow[aria-current="true"] .ta{color:var(--accent);opacity:.75}
  .trow .missing{color:#d98a6a;letter-spacing:.14em}
  .hint{margin-top:16px;font-size:.82rem;color:var(--muted);max-width:62ch}

  /* ---------- links / find me ---------- */
  .links{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:1px;background:var(--line);
    margin-top:clamp(30px,6vh,56px);
    border:1px solid var(--line);
  }
  .link{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:clamp(20px,3.4vw,32px);
    background:var(--bg);color:var(--ink);text-decoration:none;
    transition:background .4s cubic-bezier(.2,.7,.2,1),color .4s ease;
  }
  .link:hover,.link:focus-visible{background:var(--accent);color:#120c04;outline:none}
  .link .lk-label{
    display:block;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;
    color:var(--muted);transition:color .4s ease;
  }
  .link:hover .lk-label,.link:focus-visible .lk-label{color:#120c04;opacity:.75}
  .link .lk-value{
    display:block;font-family:var(--display);font-weight:500;
    font-size:clamp(1.05rem,2.4vw,1.5rem);letter-spacing:-.01em;
    margin-top:6px;word-break:break-all;
  }
  .link .lk-handle{
    display:block;font-size:.76rem;letter-spacing:.06em;
    color:var(--muted);margin-top:4px;
    transition:color .4s ease;
  }
  .link:hover .lk-handle,.link:focus-visible .lk-handle{color:#120c04;opacity:.8}

  .link .lk-arrow{
    flex:0 0 auto;font-size:1.15rem;
    transition:transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .link:hover .lk-arrow,.link:focus-visible .lk-arrow{transform:translateX(7px)}

  /* ---------- reveal ---------- */
  .reveal{
    opacity:0;transform:translateY(26px);filter:blur(7px);
    transition:opacity .95s cubic-bezier(.2,.7,.2,1),
               transform .95s cubic-bezier(.2,.7,.2,1),
               filter .95s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.in{opacity:1;transform:none;filter:none}

  /* ---------- motion preferences ---------- */
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none;filter:none}
    .name .ch{transform:none}
    #dust,.glow{display:none}
    .quote-track{height:auto}
    .quote-sticky{position:static;height:auto;display:block}
    .quote-stage{display:block;min-height:0}
    #quoteText{opacity:1;transform:none}
  }

  @media (max-width:620px){
    .hero{align-items:center}
  }
</style>
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<canvas id="dust" aria-hidden="true"></canvas>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow" id="eyebrow">Personal · Motivation</p>
    <h1 class="name" id="name" aria-label="Your Name"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="hero-foot">
      <span class="scroll-cue">Scroll</span>
    </div>
  </div>
</header>

<main>
  <section id="quotes">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="idx">01</span>
        <h2 id="quotesTitle">Words I Live By</h2>
      </div>
    </div>

    <div class="quote-track" id="quoteTrack">
      <div class="quote-sticky" id="quoteSticky">
        <div class="wrap">
          <blockquote class="quote-stage">
            <p id="quoteText"></p>
          </blockquote>
          <div class="q-meter" aria-hidden="true"><span id="qFill"></span></div>
          <div class="q-count">
            <span id="qIdx">01</span><span class="q-sep">/</span><span id="qTotal">05</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="songs">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="idx">02</span>
        <h2 id="songsTitle">My Soundtrack</h2>
      </div>

      <div class="player reveal" id="player">
        <div class="player-top">
          <div class="np">
            <div class="bars" id="bars" aria-hidden="true"></div>
            <div class="np-meta">
              <span class="np-title" id="npTitle">No track loaded</span>
              <span class="np-artist" id="npArtist">Add your songs</span>
            </div>
          </div>
          <div class="controls">
            <button class="ctl" id="prev" aria-label="Previous track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm3 7l9-6v12z"/></svg>
            </button>
            <button class="ctl play" id="toggle" aria-label="Play">
              <svg id="icoPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
              <svg id="icoPause" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M7 5h3.4v14H7zm6.6 0H17v14h-3.4z"/></svg>
            </button>
            <button class="ctl" id="next" aria-label="Next track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM15 12L6 18V6z"/></svg>
            </button>
          </div>
        </div>
        <div class="seek">
          <span id="tCur">0:00</span>
          <button class="track" id="seek" aria-label="Seek">
            <span class="fill" id="fill"></span><span class="knob" id="knob"></span>
          </button>
          <span id="tDur">0:00</span>
        </div>
      </div>

      <ol class="tracks reveal" id="tracks"></ol>
      <p class="hint reveal" id="songHint"></p>

      <audio id="audio" preload="metadata"></audio>
    </div>
  </section>

  <section id="closing">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="idx">03</span>
        <h2 id="closingTitle">And Now</h2>
      </div>
      <p class="closing-line reveal" id="closingLine"></p>
    </div>
  </section>

  <section id="follow">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="idx">04</span>
        <h2 id="followTitle">Find Me</h2>
      </div>
      <div class="links reveal" id="links"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <span id="footLeft"></span>
    <span id="footRight"></span>
  </div>
</footer>

<script src="content.js"></script>

<script>
/* ==========================================================================
   👆 এতটুকুই — এর নিচের কোড নিজে থেকে কাজ করবে  👆
   ========================================================================== */


/* =====================  ENGINE — no need to edit  ===================== */
(function () {
  const CONTENT = window.CONTENT;
  if (!CONTENT || typeof CONTENT !== 'object') {
    document.body.innerHTML =
      '<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#000;' +
      'color:#f5f1ea;min-height:100vh;display:grid;place-items:center;padding:32px;' +
      'line-height:1.75;font-size:15px"><div style="max-width:46ch">' +
      '<b style="color:#e9a340;font-size:17px">content.js ঠিকভাবে পড়া যাচ্ছে না।</b><br><br>' +
      'content.js ফাইলে সাধারণত এই দুইটা ভুল হয়:<br>' +
      '&nbsp;&nbsp;• কোনো লাইনের শেষে <b>কমা (,)</b> লাগাতে ভুলে গেছেন<br>' +
      '&nbsp;&nbsp;• <b>কোটেশন (&quot; &quot;)</b> — এক দিলে দুই দিতে হয়<br><br>' +
      'সহজ সমাধান: ফাইলের লেখাটা মুছে দিয়ে <b>READ-ME-FIRST.txt</b> ফাইলের ' +
      'নমুনা দেখে আবার বসান।' +
      '</div></div>';
    return;
  }

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- eyebrow / name / tagline ---- */
  document.title = CONTENT.name + " · Story";
  document.getElementById('eyebrow').textContent = CONTENT.eyebrow;
  document.getElementById('tagline').innerHTML = CONTENT.tagline;
  document.getElementById('footLeft').textContent = CONTENT.footLeft;
  document.getElementById('footRight').textContent = CONTENT.footRight;
  document.getElementById('quotesTitle').textContent = CONTENT.quotesTitle;
  document.getElementById('songsTitle').textContent = CONTENT.songsTitle;
  document.getElementById('closingTitle').textContent = CONTENT.closingTitle;
  document.getElementById('followTitle').textContent = CONTENT.followTitle;

  /* ---- name: split into lines + chars, stagger reveal ---- */
  const nameEl = document.getElementById('name');
  nameEl.setAttribute('aria-label', CONTENT.name);
  const words = CONTENT.name.split(' ');
  let i = 0;
  words.forEach((word, wi) => {
    const ln = document.createElement('span');
    ln.className = 'ln';
    [...word].forEach(ch => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch;
      s.style.animationDelay = (0.25 + i * 0.045) + 's';
      ln.appendChild(s);
      i++;
    });
    nameEl.appendChild(ln);
    if (wi < words.length - 1) nameEl.appendChild(document.createElement('br'));
    if (wi < words.length - 1) i += 2;
  });

  /* ---- closing ---- */
  const closingEl = document.getElementById('closingLine');
  const bits = CONTENT.closing.split(/(<strong>.*?<\/strong>)/g);
  bits.forEach(b => {
    const m = b.match(/^<strong>(.*)<\/strong>$/);
    if (m) { const s = document.createElement('strong'); s.textContent = m[1]; closingEl.appendChild(s); }
    else if (b) closingEl.appendChild(document.createTextNode(b));
  });

  /* ---- links ---- */
  const linksEl = document.getElementById('links');
  (CONTENT.links || []).forEach(l => {
    const a = document.createElement('a');
    a.className = 'link';
    a.href = l.href;
    a.target = '_blank';
    a.rel = 'noopener';
    const box = document.createElement('span');
    const lab = document.createElement('span'); lab.className = 'lk-label'; lab.textContent = l.label || 'Link';
    const val = document.createElement('span'); val.className = 'lk-value'; val.textContent = l.name || l.value || '';
    box.append(lab, val);
    if (l.handle) {
      const h = document.createElement('span'); h.className = 'lk-handle'; h.textContent = l.handle;
      box.appendChild(h);
    }
    const ar = document.createElement('span'); ar.className = 'lk-arrow'; ar.setAttribute('aria-hidden', 'true'); ar.textContent = '\u2192';
    a.append(box, ar);
    linksEl.appendChild(a);
  });

  /* ---- scroll reveal ---- */
  const targets = document.querySelectorAll('.reveal');
  if (reduce || !('IntersectionObserver' in window)) {
    targets.forEach(t => t.classList.add('in'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });
    targets.forEach(t => io.observe(t));
  }

  /* ---- scroll progress ---- */
  const bar = document.getElementById('progress');
  const onScroll = () => {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ---- quotes: pinned + scroll-driven ---- */
  (function quoteScroll () {
    const quotes = Array.isArray(CONTENT.quotes) ? CONTENT.quotes.slice() : [];
    const track = document.getElementById('quoteTrack');
    const sticky = document.getElementById('quoteSticky');
    const stage = document.querySelector('.quote-stage');
    const qEl = document.getElementById('quoteText');
    const qIdx = document.getElementById('qIdx');
    const qTotal = document.getElementById('qTotal');
    const qFill = document.getElementById('qFill');
    const meter = document.querySelector('.q-meter');
    const count = document.querySelector('.q-count');

    if (!quotes.length) { track.remove(); return; }

    const pad = n => String(n).padStart(2, '0');
    qTotal.textContent = pad(quotes.length);

    if (reduce) {
      track.style.height = 'auto';
      sticky.style.position = 'static';
      sticky.style.height = 'auto';
      stage.style.display = 'block';
      stage.style.minHeight = '0';
      if (meter) meter.remove();
      if (count) count.remove();
      qEl.remove();
      quotes.forEach(q => {
        const p = document.createElement('p');
        p.textContent = q;
        p.style.cssText = 'font-family:var(--display);font-weight:300;' +
          'font-size:clamp(1.25rem,3.2vw,2.4rem);line-height:1.3;' +
          'letter-spacing:-.015em;margin:0 0 .85em;max-width:22ch;';
        stage.appendChild(p);
      });
      return;
    }

    track.style.setProperty('--nq', String(quotes.length));

    let cur = -1;
    function show (i) {
      if (i === cur) return;
      cur = i;
      qEl.classList.remove('in');
      setTimeout(() => {
        qEl.textContent = quotes[i];
        qEl.classList.add('in');
      }, 190);
      qIdx.textContent = pad(i + 1);
      qFill.style.width = (((i + 1) / quotes.length) * 100) + '%';
    }

    let ticking = false;
    function update () {
      ticking = false;
      const r = track.getBoundingClientRect();
      const span = r.height - window.innerHeight;
      const p = span > 0 ? (-r.top / span) : 0;
      const c = Math.max(0, Math.min(1, p));
      show(Math.min(quotes.length - 1, Math.floor(c * quotes.length)));
    }
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
  })();

  /* ---- soundtrack player ---- */
  (function soundtrack () {
    const songs = Array.isArray(CONTENT.songs) ? CONTENT.songs.slice() : [];
    const $ = id => document.getElementById(id);
    const player = $('player'), barsEl = $('bars'), audio = $('audio');
    const npTitle = $('npTitle'), npArtist = $('npArtist');
    const btnToggle = $('toggle'), btnPrev = $('prev'), btnNext = $('next');
    const icoPlay = $('icoPlay'), icoPause = $('icoPause');
    const fill = $('fill'), knob = $('knob'), seekEl = $('seek');
    const tCur = $('tCur'), tDur = $('tDur');
    const listEl = $('tracks'), hintEl = $('songHint');

    for (let k = 0; k < 7; k++) {
      const b = document.createElement('i');
      b.style.animationDelay = (k * 0.13) + 's';
      b.style.animationDuration = (0.85 + (k % 3) * 0.18) + 's';
      barsEl.appendChild(b);
    }

    let si = -1;
    const rows = [];
    const playing = () => !audio.paused && !audio.ended;
    const fmt = t => (!isFinite(t) || t < 0) ? '0:00'
      : Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

    function paint () {
      icoPlay.style.display = playing() ? 'none' : '';
      icoPause.style.display = playing() ? '' : 'none';
      player.classList.toggle('playing', playing());
      btnToggle.setAttribute('aria-label', playing() ? 'Pause' : 'Play');
    }

    function select (i) {
      if (!songs.length) return;
      si = ((i % songs.length) + songs.length) % songs.length;
      const s = songs[si];
      audio.src = s.src;
      npTitle.textContent = s.title || 'Untitled';
      npArtist.textContent = s.artist || '—';
      fill.style.width = '0%'; knob.style.left = '0%';
      tCur.textContent = '0:00'; tDur.textContent = '0:00';
      rows.forEach((r, k) => r.setAttribute('aria-current', k === si ? 'true' : 'false'));
      const r = rows[si];
      if (r) { const bad = r.querySelector('.missing'); if (bad) bad.remove(); }
    }

    const play = () => { audio.play().catch(() => {}); };

    if (!songs.length) {
      btnToggle.disabled = btnPrev.disabled = btnNext.disabled = seekEl.disabled = true;
      npTitle.textContent = 'No song added yet';
      npArtist.textContent = 'songs/ folder';
      hintEl.textContent = 'এখনো কোনো song যোগ করা হয়নি। songs/ ফোল্ডারে mp3 ফাইল রাখুন, তারপর content.js ফাইলে songs তালিকায় নাম লিখুন।';
    } else {
      songs.forEach((s, i) => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.className = 'trow';
        b.setAttribute('aria-current', 'false');
        const tn = document.createElement('span'); tn.className = 'tn';
        tn.textContent = String(i + 1).padStart(2, '0');
        const tt = document.createElement('span'); tt.className = 'tt';
        tt.textContent = s.title || 'Untitled';
        const ta = document.createElement('span'); ta.className = 'ta';
        ta.textContent = s.artist || '—';
        b.append(tn, tt, ta);
        b.addEventListener('click', () => {
          if (i === si) { playing() ? audio.pause() : play(); }
          else { select(i); play(); }
        });
        li.appendChild(b); listEl.appendChild(li); rows.push(b);
      });
      hintEl.textContent = 'নিজের গান যোগ করতে: mp3 ফাইলগুলো songs/ ফোল্ডারে রাখুন, তারপর content.js ফাইলে songs তালিকায় নাম লিখুন।';
      select(0);
    }

    btnToggle.addEventListener('click', () => { playing() ? audio.pause() : play(); });
    btnPrev.addEventListener('click', () => { select(si - 1); play(); });
    btnNext.addEventListener('click', () => { select(si + 1); play(); });

    audio.addEventListener('play', paint);
    audio.addEventListener('pause', paint);
    audio.addEventListener('loadedmetadata', () => { tDur.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      const d = audio.duration;
      if (isFinite(d) && d > 0) {
        const p = (audio.currentTime / d) * 100;
        fill.style.width = p + '%';
        knob.style.left = p + '%';
        tCur.textContent = fmt(audio.currentTime);
      }
    });
    audio.addEventListener('ended', () => {
      if (songs.length > 1) { select(si + 1); play(); } else paint();
    });
    audio.addEventListener('error', () => {
      const r = rows[si]; if (!r) return;
      const ta = r.querySelector('.ta');
      if (ta) { ta.classList.add('missing'); ta.textContent = 'file missing'; }
      npArtist.textContent = 'file missing — check the songs/ folder';
      paint();
    });

    seekEl.addEventListener('click', e => {
      const d = audio.duration;
      if (!isFinite(d) || d <= 0) return;
      const rect = seekEl.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = p * d;
    });
  })();

  /* ---- ambient dust ---- */
  if (!reduce) {
    const cv = document.getElementById('dust');
    const ctx = cv.getContext('2d');
    let w, h, parts = [], dpr = Math.min(window.devicePixelRatio || 1, 2);

    function size() {
      w = cv.width = innerWidth * dpr;
      h = cv.height = innerHeight * dpr;
      cv.style.width = innerWidth + 'px';
      cv.style.height = innerHeight + 'px';
      const count = Math.round(Math.min(90, innerWidth / 16));
      parts = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: (Math.random() * 1.5 + 0.35) * dpr,
        vy: (Math.random() * 0.24 + 0.06) * dpr,
        vx: (Math.random() - 0.5) * 0.14 * dpr,
        a: Math.random() * 0.4 + 0.08,
        p: Math.random() * Math.PI * 2
      }));
    }

    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      for (const p of parts) {
        p.y -= p.vy;
        p.x += p.vx + Math.sin((t / 2600) + p.p) * 0.16 * dpr;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(233,163,64,' + p.a.toFixed(3) + ')';
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }

    size();
    addEventListener('resize', size);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
